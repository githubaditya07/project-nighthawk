version: '3.8'

services:
  nighthawk-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nighthawk-gateway
    ports:
      - "8080:8080"
      - "5173:5173"
    environment:
      - RUST_LOG=info
      - NIGHTHAWK_DATA_DIR=/data
    volumes:
      - mesh-data:/data
    networks:
      - nighthawk-mesh
    depends_on:
      - node-01
      - node-02
      - node-03
      - node-04
      - node-05
      - node-06
      - node-07
      - node-08
      - node-09
      - node-10
      - node-11
      - node-12

  node-01:
    image: alpine:latest
    container_name: nighthawk-node-01
    command: sh -c "mkdir -p /data/node_01 && tail -f /dev/null"
    volumes:
      - mesh-data:/data
    networks:
      - nighthawk-mesh

  node-02:
    image: alpine:latest
    container_name: nighthawk-node-02
    command: sh -c "mkdir -p /data/node_02 && tail -f /dev/null"
